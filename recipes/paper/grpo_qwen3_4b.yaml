method: grpo
run_name: grpo_qwen3_4b
entrypoint: grpo_train.py
accelerate_config: accelerate.yaml
num_processes: 8
accelerate_gradient_accumulation_steps: 4
main_process_port: 13087
metadata:
  model_scale: Qwen3-4B
  note: GRPO baseline at the main beta-OPSD model scale.
args:
  model_name_or_path: Qwen/Qwen3-4B
  learning_rate: 5e-6
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 4
  num_train_epochs: 2
  num_iterations: 2
  gradient_checkpointing: true
  use_peft: true
  lora_r: 64
  lora_alpha: 128
  lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  max_prompt_length: 2048
  max_completion_length: 16000
  num_generations: 8
  temperature: 1.2
  use_vllm: true
  vllm_mode: colocate
  logging_steps: 10
  save_steps: 20
  beta: 0.0
  loss_type: grpo
  scale_rewards: group
  wandb_project: beta-opsd
