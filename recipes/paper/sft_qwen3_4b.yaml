method: sft
run_name: sft_qwen3_4b
entrypoint: sft_train.py
accelerate_config: accelerate.yaml
num_processes: 8
accelerate_gradient_accumulation_steps: 4
main_process_port: 13085
metadata:
  model_scale: Qwen3-4B
  note: SFT baseline at the main beta-OPSD model scale.
args:
  model_name_or_path: Qwen/Qwen3-4B
  learning_rate: 5e-6
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 4
  num_train_epochs: 4
  gradient_checkpointing: true
  use_peft: true
  lora_r: 64
  lora_alpha: 128
  lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  max_length: 16000
  logging_steps: 5
  save_steps: 20
  wandb_project: beta-opsd
