method: beta_opsd_mixed_sampling
run_name: beta_opsd_mixed_sampling_qwen3_1_7b
entrypoint: beta_opsd_train.py
accelerate_config: accelerate.yaml
num_processes: 4
accelerate_gradient_accumulation_steps: 8
main_process_port: 13081
metadata:
  model_scale: Qwen3-1.7B
  target: fixed_teacher
  note: Mixed sampling ablation. Enabling use_mixed_sampling forces a fixed-teacher target in code.
args:
  model_name_or_path: Qwen/Qwen3-1.7B
  learning_rate: 5e-6
  max_grad_norm: 0.1
  per_device_train_batch_size: 1
  gradient_checkpointing: true
  gradient_accumulation_steps: 8
  max_steps: 200
  max_completion_length: 1024
  save_steps: 50
  logging_steps: 2
  attn_implementation: flash_attention_2
  dtype: bfloat16
  max_length: 20000
  beta: 0
  use_vllm: true
  vllm_mode: colocate
  vllm_gpu_memory_utilization: 0.5
  vllm_tensor_parallel_size: 1
  use_peft: true
  lora_r: 64
  lora_alpha: 128
  lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  temperature: 1.1
  top_p: 0.95
  top_k: 20
  lmbda: 1
  fixed_teacher: true
  jsd_token_clip: 0.05
  use_tinker_loss: true
  use_mixed_sampling: true
  mixed_sampling_teacher_alpha: 0.8
  mixed_sampling_teacher_alpha_linear_decay: true
  mixed_sampling_teacher_alpha_final: 0.2
  wandb_project: beta-opsd
