method: beta_opsd_mix_target_smoke
run_name: beta_opsd_mix_target_smoke
entrypoint: beta_opsd_train.py
accelerate_config: accelerate_smoke.yaml
num_processes: 1
main_process_port: 13100
metadata:
  smoke: true
args:
  model_name_or_path: Qwen/Qwen3-1.7B
  learning_rate: 5e-6
  max_grad_norm: 0.1
  per_device_train_batch_size: 1
  gradient_checkpointing: true
  gradient_accumulation_steps: 1
  max_steps: 3
  max_completion_length: 128
  save_strategy: "no"
  logging_steps: 1
  attn_implementation: flash_attention_2
  dtype: bfloat16
  max_length: 4096
  beta: 0
  use_peft: true
  lora_r: 64
  lora_alpha: 128
  lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  temperature: 1.0
  top_p: 0.95
  top_k: 20
  lmbda: 1
  mixed_teacher_target_teacher_weight: 0.5
  mixed_teacher_target_reference_model: current_student
  report_to: none
