method: opsd_smoke
run_name: opsd_smoke
entrypoint: opsd_train.py
accelerate_config: accelerate_smoke.yaml
num_processes: 1
main_process_port: 13102
metadata:
  smoke: true
args:
  model_name_or_path: Qwen/Qwen3-1.7B
  learning_rate: 5e-6
  max_grad_norm: 0.1
  per_device_train_batch_size: 1
  gradient_checkpointing: true
  gradient_accumulation_steps: 1
  max_steps: 3
  max_completion_length: 128
  logging_steps: 1
  attn_implementation: flash_attention_2
  dtype: bfloat16
  max_length: 2048
  beta: 0
  use_peft: true
  lora_r: 64
  lora_alpha: 128
  lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  temperature: 1.1
  top_p: 0.95
  top_k: 20
  lmbda: 1
  fixed_teacher: true
  jsd_token_clip: 0.05
  report_to: none
