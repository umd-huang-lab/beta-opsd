method: sft_smoke
run_name: sft_smoke
entrypoint: sft_train.py
accelerate_config: accelerate_smoke.yaml
num_processes: 1
main_process_port: 13103
metadata:
  smoke: true
args:
  model_name_or_path: Qwen/Qwen3-1.7B
  learning_rate: 5e-6
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 1
  max_steps: 3
  save_strategy: "no"
  logging_steps: 1
  gradient_checkpointing: true
  use_peft: true
  lora_r: 64
  lora_alpha: 128
  lora_target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]
  max_length: 4096
  report_to: none
